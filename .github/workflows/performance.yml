name: Performance budget

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run start > /tmp/lorki-performance.log 2>&1 &
        env:
          PORT: 3000
      - run: npx playwright install --with-deps chromium
      - run: node scripts/performance-probe.mjs
        env:
          BASE_URL: http://127.0.0.1:3000
      - run: node scripts/performance-budget.mjs
      - run: node scripts/lighthouse-baseline.mjs
        env:
          BASE_URL: http://127.0.0.1:3000
